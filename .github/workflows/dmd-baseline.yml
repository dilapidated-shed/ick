name: DMD baseline

on:
  push:
    branches:
      - dmd
    paths:
      - 'dmd/**'
      - '.github/workflows/dmd-baseline.yml'
  pull_request:
    paths:
      - 'dmd/**'
      - '.github/workflows/dmd-baseline.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Detect loaded snapshot
        id: source
        shell: bash
        run: |
          if test -f dmd/SOURCE.lock; then
            echo 'loaded=true' >> "$GITHUB_OUTPUT"
          else
            echo 'loaded=false' >> "$GITHUB_OUTPUT"
            echo 'DMD snapshot not loaded yet; baseline build skipped.'
          fi

      - name: Verify provenance boundary
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          . dmd/SOURCE.lock
          test "$upstream_repository" = https://github.com/dlang/dmd.git
          test "$upstream_tag" = v2.113.0
          test "$upstream_commit" = 74917954b53f7f35b13e61b4438c7253834929ed
          test "$upstream_compiler_src_dmd_tree" = 609b890e7cfc65474e5fdebd001c580e174cd22b
          test "$(find dmd/compiler/src/dmd -type f | wc -l | tr -d ' ')" = 329
          test -x dmd/compiler/src/build.d
          test -x dmd/compiler/src/bootstrap.sh
          test ! -e dmd/druntime
          test ! -e dmd/compiler/test

      - name: Install host compiler
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ldc
          command -v ldmd2
          c++ --version
          ldmd2 --version

      - name: Build standalone DMD
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cd dmd/compiler/src
          ldmd2 -run ./build.d dmd HOST_DMD="$(command -v ldmd2)"
          dmd_bin=$(find ../../generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          test -x "$dmd_bin"
          "$dmd_bin" --version

          cat > /tmp/dmd-baseline-smoke.d <<'EOF'
          module dmd_baseline_smoke;
          extern(C) int add(int a, int b) { return a + b; }
          EOF
          runtime_import=$(dpkg -L libphobos2-ldc-shared-dev | awk 'substr($0, length($0)-8) == "/object.d" { print substr($0, 1, length($0)-9); exit }')
          test -f "$runtime_import/object.d"
          "$dmd_bin" -betterC -c -I"$runtime_import" /tmp/dmd-baseline-smoke.d -of=/tmp/dmd-baseline-smoke.o
          test -s /tmp/dmd-baseline-smoke.o
          file /tmp/dmd-baseline-smoke.o

      - name: Qualify NetBSD amd64 BetterC target
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          dmd_bin=$(find dmd/generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          runtime_import=$(dpkg -L libphobos2-ldc-shared-dev | awk 'substr($0, length($0)-8) == "/object.d" { print substr($0, 1, length($0)-9); exit }')
          test -f "$runtime_import/object.d"

          mkdir -p dmd/qualification/.build
          netbsd_object="$GITHUB_WORKSPACE/dmd/qualification/.build/netbsd_amd64_betterc.o"

          "$dmd_bin" \
            -betterC \
            -c \
            -fPIC \
            -target=x86_64-unknown-netbsd \
            -I"$runtime_import" \
            dmd/qualification/netbsd_amd64_betterc.d \
            -of="$netbsd_object"

          test -s "$netbsd_object"
          readelf -h "$netbsd_object" | tee /tmp/netbsd_amd64_betterc.elf
          grep -Eq 'Class:[[:space:]]+ELF64' /tmp/netbsd_amd64_betterc.elf
          grep -Eq 'OS/ABI:[[:space:]]+UNIX - System V' /tmp/netbsd_amd64_betterc.elf
          grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64' /tmp/netbsd_amd64_betterc.elf
          readelf -Ws "$netbsd_object" | tee /tmp/netbsd_amd64_betterc.symbols
          grep -Eq '[[:space:]]netbsd_add
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: pinned standalone DMD source built from the owned Mars snapshot.

          PASS: the resulting compiler started and produced a BetterC object.

          PASS: Icky DMD emitted an ELF64/System-V NetBSD amd64 BetterC PIC object with version(NetBSD), version(Posix), and version(X86_64).

          PASS: NetBSD 9.3 amd64's native C toolchain linked that exact object and executed integer, 64-bit integer, floating-point, pointer, mixed aggregate, C varargs, C callback, and TLS crossings successfully.

          OUT OF SCOPE: druntime, Phobos, full-D executable startup, upstream tests, and Icky D Unicode syntax.
          EOF
 /tmp/netbsd_amd64_betterc.symbols
          grep -Eq '[[:space:]]netbsd_mixed
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: pinned standalone DMD source built from the owned Mars snapshot.

          PASS: the resulting compiler started and produced a BetterC object.

          PASS: Icky DMD emitted an ELF64/System-V NetBSD amd64 BetterC object with version(NetBSD), version(Posix), and version(X86_64).

          OUT OF SCOPE: native NetBSD linking/execution, druntime, Phobos, upstream tests, and Icky D Unicode syntax.
          EOF
 /tmp/netbsd_amd64_betterc.symbols
          grep -Eq '[[:space:]]netbsd_vararg_sum
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: pinned standalone DMD source built from the owned Mars snapshot.

          PASS: the resulting compiler started and produced a BetterC object.

          PASS: Icky DMD emitted an ELF64/System-V NetBSD amd64 BetterC object with version(NetBSD), version(Posix), and version(X86_64).

          OUT OF SCOPE: native NetBSD linking/execution, druntime, Phobos, upstream tests, and Icky D Unicode syntax.
          EOF
 /tmp/netbsd_amd64_betterc.symbols
          grep -Eq '[[:space:]]netbsd_tls_bump
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: pinned standalone DMD source built from the owned Mars snapshot.

          PASS: the resulting compiler started and produced a BetterC object.

          PASS: Icky DMD emitted an ELF64/System-V NetBSD amd64 BetterC object with version(NetBSD), version(Posix), and version(X86_64).

          OUT OF SCOPE: native NetBSD linking/execution, druntime, Phobos, upstream tests, and Icky D Unicode syntax.
          EOF
 /tmp/netbsd_amd64_betterc.symbols

      - name: Link and run the exact object on NetBSD 9.3 amd64
        if: steps.source.outputs.loaded == 'true'
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92
        with:
          release: "9.3"
          arch: x86_64
          sync: rsync
          run: |
            set -eu
            test "$(uname -s)" = NetBSD
            test "$(uname -m)" = amd64
            uname -a

            object="$GITHUB_WORKSPACE/dmd/qualification/.build/netbsd_amd64_betterc.o"
            harness="$GITHUB_WORKSPACE/dmd/qualification/netbsd_amd64_abi.c"
            executable="$GITHUB_WORKSPACE/dmd/qualification/.build/netbsd_amd64_abi"

            test -s "$object"
            test -f "$harness"
            cc -std=c11 -O2 -Wall -Wextra -Werror -Wpedantic \
              "$harness" "$object" -o "$executable"
            test -x "$executable"
            file "$executable"
            "$executable"

      - name: Record boundary
        if: steps.source.outputs.loaded == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: pinned standalone DMD source built from the owned Mars snapshot.

          PASS: the resulting compiler started and produced a BetterC object.

          PASS: Icky DMD emitted an ELF64/System-V NetBSD amd64 BetterC object with version(NetBSD), version(Posix), and version(X86_64).

          OUT OF SCOPE: native NetBSD linking/execution, druntime, Phobos, upstream tests, and Icky D Unicode syntax.
          EOF
