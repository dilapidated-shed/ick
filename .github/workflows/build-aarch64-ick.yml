name: Build AArch64 ICK

on:
  push:
    branches:
      - aarch64-polar-bootstrap
  pull_request:
    branches:
      - bootstrap/ick-binary
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out ICK patch and build definition
        uses: actions/checkout@v4
        with:
          path: meta

      - name: Check out inspected GCC polar line
        uses: actions/checkout@v4
        with:
          repository: isomorphisms/the-equality-sign-means-equality
          ref: 756f5b0aeeabc67caf804380495f82d86b87b878
          fetch-depth: 1
          path: src

      - name: Apply physical polar complex representation
        run: |
          cd src
          python3 ../meta/compiler/apply_ick_polar_complex_aarch64.py
          git diff --check
          git diff --stat

      - name: Install build and AArch64 tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev zstd \
            binutils-aarch64-linux-gnu

      - name: Configure AArch64 cross compiler
        run: |
          mkdir build stage
          cd build
          ../src/configure \
            --target=aarch64-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/stage" \
            --enable-languages=c \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --without-headers \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv

      - name: Build compiler
        run: |
          make -C build -j2 all-gcc
          make -C build install-gcc
          ln -s aarch64-linux-gnu-gcc stage/bin/ick-aarch64

      - name: Verify AArch64 target
        shell: bash
        run: |
          set -euxo pipefail
          stage/bin/ick-aarch64 --version

          cat > /tmp/plain.c <<'EOF'
          int add(int a, int b) { return a + b; }
          EOF
          stage/bin/ick-aarch64 -O2 -c /tmp/plain.c -o /tmp/plain.o
          aarch64-linux-gnu-readelf -h /tmp/plain.o | tee /tmp/plain.elf
          grep -q 'Machine:.*AArch64' /tmp/plain.elf

      - name: Verify physical polar object representation
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/storage.c <<'EOF'
          double _Complex stored = 3.0 + 4.0i;
          EOF
          stage/bin/ick-aarch64 -O2 -c /tmp/storage.c -o /tmp/storage.o
          aarch64-linux-gnu-readelf -h /tmp/storage.o | tee /tmp/storage.elf
          grep -q 'Machine:.*AArch64' /tmp/storage.elf
          aarch64-linux-gnu-objcopy --dump-section .data=/tmp/storage.data /tmp/storage.o
          python3 - <<'PY'
          import math
          import struct
          from pathlib import Path

          raw = Path('/tmp/storage.data').read_bytes()
          if len(raw) != 16:
              raise SystemExit(f'expected exactly 16 data bytes, got {len(raw)}')
          radius, angle = struct.unpack('<dd', raw)
          expected_angle = math.atan2(4.0, 3.0)
          if abs(radius - 5.0) > 1.0e-12:
              raise SystemExit(f'physical complex slot 0 is {radius}, expected radius 5')
          if abs(angle - expected_angle) > 1.0e-12:
              raise SystemExit(
                  f'physical complex slot 1 is {angle}, expected argument {expected_angle}'
              )
          print(f'polar storage verified: radius={radius}, angle={angle}')
          PY

      - name: Verify native polar multiplication lowering
        shell: bash
        run: |
          set -euxo pipefail
          cat > /tmp/complex.c <<'EOF'
          double _Complex multiply(double _Complex a, double _Complex b)
          {
            return a * b;
          }
          EOF
          stage/bin/ick-aarch64 -O2 -S /tmp/complex.c -o /tmp/complex.s
          stage/bin/ick-aarch64 -O2 -c /tmp/complex.c -o /tmp/complex.o
          aarch64-linux-gnu-readelf -h /tmp/complex.o | tee /tmp/complex.elf
          grep -q 'Machine:.*AArch64' /tmp/complex.elf
          cat /tmp/complex.s

          # Physical polar multiplication should be radius multiplication and
          # argument addition, with no Cartesian→polar→Cartesian round trip.
          grep -q 'fmul' /tmp/complex.s
          grep -q 'fadd' /tmp/complex.s
          if grep -Eq 'hypot|atan2|cos|sin' /tmp/complex.s; then
            echo 'complex multiplication still contains a polar conversion round trip' >&2
            exit 1
          fi

      - name: Package AArch64 compiler
        run: |
          tar --zstd -cf ick-aarch64-linux.tar.zst -C stage .
          sha256sum ick-aarch64-linux.tar.zst > ick-aarch64-linux.tar.zst.sha256

      - name: Upload AArch64 compiler
        uses: actions/upload-artifact@v4
        with:
          name: ick-aarch64-linux
          path: |
            ick-aarch64-linux.tar.zst
            ick-aarch64-linux.tar.zst.sha256
          if-no-files-found: error
          retention-days: 30
