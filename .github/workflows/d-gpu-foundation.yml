name: D GPU foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: d-gpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gdc-offload-seam:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Materialize ICK source
        shell: bash
        run: |
          set -euxo pipefail
          sh ick/materialize.sh gcc source

      - name: Install GDC build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gdc flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev

      - name: Build native ICK with D enabled
        shell: bash
        run: |
          set -euxo pipefail
          mkdir build stage
          cd build
          ../source/configure \
            --prefix="$GITHUB_WORKSPACE/stage" \
            --enable-languages=c,d \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv
          make -j"$(nproc)" all-gcc
          make install-gcc

      - name: Compile D through the GPU offload attributes
        shell: bash
        run: |
          set -euxo pipefail

          gdc=$(find "$GITHUB_WORKSPACE/stage/bin" -maxdepth 1 -type f \
            \( -name gdc -o -name '*-gdc' \) | head -n 1)
          test -n "$gdc"

          mkdir -p /tmp/ick-d-gpu
          cd /tmp/ick-d-gpu

          "$gdc" \
            -fopenmp \
            -fdump-tree-gimple \
            -I"$GITHUB_WORKSPACE/qualification/d-gpu" \
            -c "$GITHUB_WORKSPACE/qualification/d-gpu/probe.d" \
            -o probe.o

          dump=$(find . -maxdepth 1 -type f -name '*gimple*' | head -n 1)
          test -n "$dump"

          grep -q 'omp declare target' "$dump"
          grep -q 'omp declare target nohost' "$dump"

      - name: Record qualification boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: ICK materialized with the imported GDC frontend.

          PASS: native ICK/GDC compiled D source carrying the new GPU attributes.

          PASS: GIMPLE contains GCC's internal `omp declare target` and
          `omp declare target nohost` attributes produced by the D-facing
          GPU declarations.

          SKIP: this host-side receipt does not launch on physical GPU hardware.
          EOF

  nvptx-device-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Materialize ICK source
        shell: bash
        run: |
          set -euxo pipefail
          sh ick/materialize.sh gcc source

      - name: Install NVPTX D compiler build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gdc flex bison texinfo nvptx-tools \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev

      - name: Build nvptx-none ICK with D enabled
        shell: bash
        run: |
          set -euxo pipefail
          mkdir build-nvptx stage-nvptx
          cd build-nvptx
          ../source/configure \
            --target=nvptx-none \
            --prefix="$GITHUB_WORKSPACE/stage-nvptx" \
            --enable-languages=c,d \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --without-headers \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv
          make -j"$(nproc)" all-gcc
          make install-gcc

      - name: Emit a PTX kernel from D
        shell: bash
        run: |
          set -euxo pipefail

          gdc="$GITHUB_WORKSPACE/stage-nvptx/bin/nvptx-none-gdc"
          test -x "$gdc"

          "$gdc" \
            -S -O2 \
            -fno-druntime \
            -nostdinc \
            -I"$GITHUB_WORKSPACE/qualification/d-gpu" \
            "$GITHUB_WORKSPACE/qualification/d-gpu/nvptx-kernel.d" \
            -o /tmp/ick-gpu-kernel.ptx

          grep -Eq '^[[:space:]]*\.visible[[:space:]]+\.entry[[:space:]]+ick_gpu_probe' \
            /tmp/ick-gpu-kernel.ptx
          grep -q 'ld\.param' /tmp/ick-gpu-kernel.ptx
          grep -q 'st\.global' /tmp/ick-gpu-kernel.ptx

      - name: Record device artifact receipt
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: ICK/GDC was built directly for `nvptx-none`.

          PASS: D `@attribute("gpu_kernel")` became a visible PTX `.entry`.

          PASS: emitted PTX contains parameter loads and a global-memory store.

          SKIP: this receipt proves device artifact generation, not CUDA-driver
          loading or physical execution.
          EOF
