name: Android ABI foundation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_NDK_VERSION: 29.0.14206865
  ANDROID_API: 21

jobs:
  workflow-integrity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Keep action pins and qualification source exact
        uses: isomorphisms/ai-ci@b3af13b3ab2bac9dd7c72bf9dd855ed5a17609b5
        with:
          suite: .github/ai-ci/suite.tsv

  imprecise-semantics:
    name: Five numeric types and Circle96 semantics
    runs-on: ubuntu-24.04
    steps:
      - name: Check out ICK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Exercise every storage code
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O2 -Iick/include \
            qualification/imprecise-types/semantic.c \
            -o /tmp/ick-imprecise-semantic
          /tmp/ick-imprecise-semantic

      - name: Report residuals without judging them
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -O2 -Iick/include \
            qualification/imprecise-types/residuals.c \
            -o /tmp/ick-residuals
          /tmp/ick-residuals | tee /tmp/ick-residuals.txt
          {
            echo '### Compact-type and Circle96 residuals'
            echo
            echo 'Residual convention: result - reference. Residual magnitude is diagnostic only.'
            echo
            echo '```text'
            grep -E '^(summary|sample,circle96|report_complete)' /tmp/ick-residuals.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check four-lane FFT butterfly semantics
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=c11 -Wall -Wextra -Werror -O2             qualification/android-boundary/ick-armv7-neon-fft.c             qualification/android-boundary/ick-armv7-neon-fft-semantic.c             -o /tmp/ick-armv7-neon-fft-semantic
          /tmp/ick-armv7-neon-fft-semantic

  qualify:
    name: ${{ matrix.abi }} source and boundary
    needs: imprecise-semantics
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            gnu_target: aarch64-linux-gnu
            binutils_package: binutils-aarch64-linux-gnu
            binutils_prefix: aarch64-linux-gnu
            ndk_driver: aarch64-linux-android21-clang
            wrong_ndk_driver: i686-linux-android21-clang
            elf_class: ELF64
            elf_machine: AArch64
            required_load_alignment: 16384
            target_flags: -ffixed-x18
          - abi: armeabi-v7a
            gnu_target: arm-linux-gnueabi
            binutils_package: binutils-arm-linux-gnueabi
            binutils_prefix: arm-linux-gnueabi
            ndk_driver: armv7a-linux-androideabi21-clang
            wrong_ndk_driver: aarch64-linux-android21-clang
            elf_class: ELF32
            elf_machine: ARM
            required_load_alignment: 4096
            target_flags: -march=armv7-a -mthumb -mfpu=neon -mfloat-abi=softfp
          - abi: x86_64
            gnu_target: x86_64-linux-gnu
            binutils_package: binutils-x86-64-linux-gnu
            binutils_prefix: x86_64-linux-gnu
            ndk_driver: x86_64-linux-android21-clang
            wrong_ndk_driver: i686-linux-android21-clang
            elf_class: ELF64
            elf_machine: Advanced Micro Devices X86-64
            required_load_alignment: 16384
            target_flags: -march=x86-64-v2 -mno-avx -mno-movbe
          - abi: x86
            gnu_target: i686-linux-gnu
            binutils_package: binutils-i686-linux-gnu
            binutils_prefix: i686-linux-gnu
            ndk_driver: i686-linux-android21-clang
            wrong_ndk_driver: x86_64-linux-android21-clang
            elf_class: ELF32
            elf_machine: Intel 80386
            required_load_alignment: 4096
            target_flags: -march=i686 -mssse3 -mno-sse4 -mno-sse4.1 -mno-sse4.2 -mno-avx -mno-movbe -mfpmath=sse -mstackrealign -mpreferred-stack-boundary=4 -mincoming-stack-boundary=4

    steps:
      - name: Check out ICK source and pinned GCC reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Verify and materialize the squashed ICK source
        shell: bash
        run: |
          set -euxo pipefail
          . ick/SOURCE.lock
          test "$(git -C gcc rev-parse HEAD)" = "$gcc_commit"
          bash ick/materialize.sh gcc source
          test -s source/COPYING3
          test -s source/COPYING.RUNTIME
          test -s source/gcc/config/linux-android.h
          test -s source/gcc/testsuite/gcc.dg/ick-complex-polar-layout.c

      - name: Install compiler build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential file flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev \
            "${{ matrix.binutils_package }}"

      - name: Configure ${{ matrix.abi }} ICK
        shell: bash
        run: |
          set -euxo pipefail
          target_as="$(command -v "${{ matrix.binutils_prefix }}-as")"
          target_ld="$(command -v "${{ matrix.binutils_prefix }}-ld")"
          mkdir build stage
          cd build
          ../source/configure \
            --target="${{ matrix.gnu_target }}" \
            --prefix="$GITHUB_WORKSPACE/stage" \
            --with-as="$target_as" \
            --with-ld="$target_ld" \
            --enable-languages=c \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --without-headers \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv

      - name: Build ${{ matrix.abi }} ICK
        shell: bash
        run: |
          set -euxo pipefail
          make -C build -j2 all-gcc
          make -C build install-gcc
          ick="$GITHUB_WORKSPACE/stage/bin/${{ matrix.gnu_target }}-gcc"
          "$ick" --version
          cc1_path="$("$ick" -print-prog-name=cc1)"
          test -x "$cc1_path"
          case "$cc1_path" in
            "$GITHUB_WORKSPACE/stage"/*) ;;
            *) echo "cc1 escaped the ICK installation: $cc1_path" >&2; exit 1 ;;
          esac

      - name: Verify ordinary C and target identity
        shell: bash
        run: |
          set -euxo pipefail
          ick="$GITHUB_WORKSPACE/stage/bin/${{ matrix.gnu_target }}-gcc"
          readelf="${{ matrix.binutils_prefix }}-readelf"
          read -r -a target_flags <<< '${{ matrix.target_flags }}'

          cat > /tmp/plain.c <<'EOF'
          int add(int left, int right) { return left + right; }
          EOF
          "$ick" "${target_flags[@]}" -std=c11 -O2 -fPIC \
            -c /tmp/plain.c -o /tmp/plain.o
          "$readelf" -h /tmp/plain.o | tee /tmp/plain.elf
          grep -q 'Class:.*${{ matrix.elf_class }}' /tmp/plain.elf
          grep -q 'Machine:' /tmp/plain.elf
          grep -Fq '${{ matrix.elf_machine }}' /tmp/plain.elf

      - name: Verify five numeric types and Circle96 with ICK
        shell: bash
        run: |
          set -euxo pipefail
          ick="$GITHUB_WORKSPACE/stage/bin/${{ matrix.gnu_target }}-gcc"
          read -r -a target_flags <<< '${{ matrix.target_flags }}'

          "$ick" "${target_flags[@]}" -std=c11 -O2 -fPIC -ffreestanding -nostdinc \
            -Iick/include -c qualification/imprecise-types/compile.c \
            -o /tmp/ick-imprecise.o
          "${{ matrix.binutils_prefix }}-nm" -u /tmp/ick-imprecise.o \
            | tee /tmp/ick-imprecise.undefined
          ! grep -Eq '__aeabi_d|__(add|sub|mul|div)df3' \
            /tmp/ick-imprecise.undefined

          for kind in E5M3 CIRCLE CIRCLE_ROTATION_MIX; do
            if "$ick" "${target_flags[@]}" -std=c11 -O2 -ffreestanding -nostdinc \
                -Iick/include -DTEST_$kind \
                -c qualification/imprecise-types/reject-arithmetic.c \
                -o /tmp/reject-$kind.o \
                > /tmp/reject-$kind.log 2>&1; then
              echo "$kind category error was accepted" >&2
              exit 1
            fi
            grep -Eqi 'invalid operands|incompatible types' /tmp/reject-$kind.log
          done

      - name: Verify Android-specific compile rules
        shell: bash
        run: |
          set -euxo pipefail
          ick="$GITHUB_WORKSPACE/stage/bin/${{ matrix.gnu_target }}-gcc"
          readelf="${{ matrix.binutils_prefix }}-readelf"
          read -r -a target_flags <<< '${{ matrix.target_flags }}'
          source_file=qualification/android-boundary/ick-android-math.c

          "$ick" "${target_flags[@]}" -std=gnu11 -O2 -fPIC \
            -fvisibility=hidden -S "$source_file" -o /tmp/ick-android-math.s
          "$ick" "${target_flags[@]}" -std=gnu11 -O2 -fPIC \
            -fvisibility=hidden -c "$source_file" -o /tmp/ick-android-math.o

          case '${{ matrix.abi }}' in
            arm64-v8a)
              if grep -Eq '(^|[^[:alnum:]_])(x18|w18)([^[:alnum:]_]|$)' \
                  /tmp/ick-android-math.s; then
                echo 'Android-reserved x18 was used' >&2
                exit 1
              fi
              ;;
            armeabi-v7a)
              "$readelf" -A /tmp/ick-android-math.o | tee /tmp/arm.attributes
              grep -q 'Tag_CPU_arch: v7' /tmp/arm.attributes
              grep -q 'Tag_THUMB_ISA_use: Thumb-2' /tmp/arm.attributes
              if grep -q 'Tag_ABI_VFP_args: VFP registers' /tmp/arm.attributes; then
                echo 'hard-float argument convention is not Android armeabi-v7a' >&2
                exit 1
              fi

              neon_source=qualification/android-boundary/ick-armv7-neon-fft.c
              # ARMv7 NEON binary32 arithmetic flushes subnormals rather than
              # preserving the strict scalar IEEE behavior. Opt only this explicit
              # SIMD qualification kernel into that numerical contract.
              neon_fp_flags=(-funsafe-math-optimizations)
              "$ick" "${target_flags[@]}" "${neon_fp_flags[@]}" -std=c11 -O3 -fPIC \
                -S "$neon_source" -o /tmp/ick-armv7-neon.s
              "$ick" "${target_flags[@]}" "${neon_fp_flags[@]}" -std=c11 -O3 -fPIC \
                -c "$neon_source" -o /tmp/ick-armv7-neon.o

              echo '--- ICK ARMv7 NEON FFT assembly ---'
              cat /tmp/ick-armv7-neon.s
              echo '--- end ICK ARMv7 NEON FFT assembly ---'

              grep -Eq 'v(mul|mla|mls)\.f32[[:space:]]+q[0-9]+' \
                /tmp/ick-armv7-neon.s
              grep -Eq 'vadd\.f32[[:space:]]+q[0-9]+' /tmp/ick-armv7-neon.s
              grep -Eq 'vsub\.f32[[:space:]]+q[0-9]+' /tmp/ick-armv7-neon.s

              "$readelf" -A /tmp/ick-armv7-neon.o | tee /tmp/ick-armv7-neon.attributes
              grep -q 'Tag_Advanced_SIMD_arch: NEONv1' /tmp/ick-armv7-neon.attributes

              "${{ matrix.binutils_prefix }}-nm" -u /tmp/ick-armv7-neon.o \
                | tee /tmp/ick-armv7-neon.undefined
              ! grep -Eq '__aeabi_f(add|sub|mul)|(^|[[:space:]])memcpy$' \
                /tmp/ick-armv7-neon.undefined

              if grep -q 'Tag_ABI_VFP_args: VFP registers' /tmp/ick-armv7-neon.attributes; then
                echo 'NEON FFT object escaped the Android softfp ABI' >&2
                exit 1
              fi
              ;;
            x86)
              "$ick" "${target_flags[@]}" -Q --help=target \
                -c /tmp/plain.c -o /tmp/options.o | tee /tmp/x86-options
              grep -Eq -- '-mstackrealign[[:space:]]+\[enabled\]' /tmp/x86-options
              ;;
            x86_64)
              "$ick" "${target_flags[@]}" -dM -E -x c /dev/null \
                > /tmp/x86_64-macros
              grep -q '^#define __SSE4_2__ 1$' /tmp/x86_64-macros
              grep -q '^#define __POPCNT__ 1$' /tmp/x86_64-macros
              ! grep -q '^#define __AVX__ 1$' /tmp/x86_64-macros
              ;;
          esac

          "${{ matrix.binutils_prefix }}-nm" -u /tmp/ick-android-math.o \
            | tee /tmp/ick-android-math.undefined
          ! grep -Eq '__mul(sc|dc|xc)3|__div(sc|dc|xc)3' \
            /tmp/ick-android-math.undefined

      - name: Install pinned Android NDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: ''

      - name: Fetch pinned Android NDK
        shell: bash
        run: |
          set -euxo pipefail
          sdkmanager "ndk;$ANDROID_NDK_VERSION"

      - name: Verify ARM32 ICK against unmodified Bionic headers
        if: matrix.abi == 'armeabi-v7a'
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          sysroot="$ndk/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          ick="$GITHUB_WORKSPACE/stage/bin/arm-linux-gnueabi-gcc"
          common=(
            --sysroot="$sysroot"
            -isystem "$sysroot/usr/include"
            -isystem "$sysroot/usr/include/arm-linux-androideabi"
            -D__ANDROID__
            -std=c17 -O2 -fPIC
            -marm -march=armv7-a -mfloat-abi=softfp -mfpu=vfpv3-d16
            -Wall -DBIONIC_IOCTL_NO_SIGNEDNESS_OVERLOAD
          )

          "$ick" "${common[@]}" -D__ANDROID_API__=26             -c qualification/android-boundary/bionic-nullability.c             -o /tmp/bionic-nullability.o
          "$ick" "${common[@]}" -D__ANDROID_API__=26             -c qualification/android-boundary/bionic-availability.c             -o /tmp/bionic-availability-api26.o
          "$ick" "${common[@]}" -D__ANDROID_API__=26             -c qualification/android-boundary/bionic-headers.c             -o /tmp/bionic-headers.o

          if "$ick" "${common[@]}" -D__ANDROID_API__=25               -c qualification/android-boundary/bionic-availability.c               -o /tmp/bionic-availability-api25.o               >/tmp/bionic-availability-api25.log 2>&1; then
            echo 'strict API-26 availability was accepted from API 25' >&2
            exit 1
          fi
          grep -Eqi 'requires Android API 26' /tmp/bionic-availability-api25.log
          test ! -e /tmp/bionic-availability-api25.o

          arm-linux-gnueabi-readelf -h -A /tmp/bionic-headers.o | tee /tmp/bionic-headers.abi
          grep -q 'Class:.*ELF32' /tmp/bionic-headers.abi
          grep -q 'Machine:.*ARM' /tmp/bionic-headers.abi
          grep -q 'Tag_ARM_ISA_use: Yes' /tmp/bionic-headers.abi
          ! grep -q 'Tag_ABI_VFP_args: VFP registers' /tmp/bionic-headers.abi

      - name: Preserve the A1 compiler for consumer qualification
        if: matrix.abi == 'armeabi-v7a'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ick-a1-${{ github.sha }}
          if-no-files-found: error
          path: |
            build/gcc/xgcc
            build/gcc/cc1
            build/gcc/collect2
            build/gcc/include/
            build/gcc/include-fixed/

      - name: Verify API floor and scalar ABI sizes
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          llvm_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ndk_cc="$llvm_bin/${{ matrix.ndk_driver }}"
          ick="$GITHUB_WORKSPACE/stage/bin/${{ matrix.gnu_target }}-gcc"
          read -r -a target_flags <<< '${{ matrix.target_flags }}'
          test -x "$ndk_cc"

          minimum="$(sed -n 's/.*"min"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p' \
            "$ndk/meta/platforms.json" | head -1)"
          test "$ANDROID_API" = "$minimum"

          "$ick" "${target_flags[@]}" -dM -E -x c /dev/null > /tmp/ick.macros
          "$ndk_cc" -dM -E -x c /dev/null > /tmp/ndk.macros
          for macro in \
              __SIZEOF_POINTER__ __SIZEOF_LONG__ __SIZEOF_INT__ \
              __SIZEOF_FLOAT__ __SIZEOF_DOUBLE__ __BYTE_ORDER__; do
            ick_value="$(awk -v name="$macro" '$2 == name { print $3 }' /tmp/ick.macros)"
            ndk_value="$(awk -v name="$macro" '$2 == name { print $3 }' /tmp/ndk.macros)"
            test -n "$ick_value"
            test "$ick_value" = "$ndk_value"
          done
          ! grep -Eq '(^|[^[:alnum:]_])long[[:space:]]+double([^[:alnum:]_]|$)' \
            qualification/android-boundary/ick-android-math.c

      - name: Link ICK and reference Android shared libraries
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          ndk="$sdk_root/ndk/$ANDROID_NDK_VERSION"
          llvm_bin="$ndk/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ndk_cc="$llvm_bin/${{ matrix.ndk_driver }}"
          wrong_ndk_cc="$llvm_bin/${{ matrix.wrong_ndk_driver }}"
          bridge=qualification/android-boundary/ndk-bridge.c
          source_file=qualification/android-boundary/ick-android-math.c

          "$ndk_cc" -std=c11 -O2 -fPIC -fvisibility=hidden \
            -c "$bridge" -o /tmp/ndk-bridge.o
          "$ndk_cc" -shared \
            -Wl,-z,defs -Wl,-z,text -Wl,--fatal-warnings \
            -Wl,-soname,libick-foundation.so \
            /tmp/ick-android-math.o /tmp/ndk-bridge.o \
            -lm -o /tmp/libick-foundation.so

          "$ndk_cc" -std=gnu11 -O2 -fPIC -fvisibility=hidden \
            -c "$source_file" -o /tmp/reference-android-math.o
          "$ndk_cc" -shared \
            -Wl,-z,defs -Wl,-z,text -Wl,--fatal-warnings \
            -Wl,-soname,libreference-foundation.so \
            /tmp/reference-android-math.o /tmp/ndk-bridge.o \
            -lm -o /tmp/libreference-foundation.so

          "$llvm_bin/llvm-readelf" -h /tmp/libick-foundation.so \
            | tee /tmp/libick-foundation.elf
          grep -q 'Class:.*${{ matrix.elf_class }}' /tmp/libick-foundation.elf
          grep -q 'Machine:' /tmp/libick-foundation.elf
          grep -Fq '${{ matrix.elf_machine }}' /tmp/libick-foundation.elf

          "$llvm_bin/llvm-nm" -D --defined-only /tmp/libick-foundation.so \
            | awk '{ print $3 }' | sed '/^$/d' | sort -u > /tmp/ick.exports
          "$llvm_bin/llvm-nm" -D --defined-only /tmp/libreference-foundation.so \
            | awk '{ print $3 }' | sed '/^$/d' | sort -u > /tmp/reference.exports
          diff -u /tmp/reference.exports /tmp/ick.exports
          grep -qx 'ick_complex_cartesian' /tmp/ick.exports
          grep -qx 'wegert_ick_runtime_probe' /tmp/ick.exports

          if "$wrong_ndk_cc" -shared -Wl,-z,defs \
              /tmp/ick-android-math.o -o /tmp/wrong-target.so \
              -lm \
              >/tmp/wrong-target.log 2>&1; then
            echo 'mismatched Android target accepted the ICK object' >&2
            exit 1
          fi
          grep -Eiq 'incompatible|wrong ELF class|different ELF class' \
            /tmp/wrong-target.log

      - name: Verify ABI-appropriate load alignment
        shell: bash
        run: |
          set -euxo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          llvm_bin="$sdk_root/ndk/$ANDROID_NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin"
          "$llvm_bin/llvm-readelf" -lW /tmp/libick-foundation.so \
            | tee /tmp/libick-foundation.program-headers
          mapfile -t aligns < <(
            awk '$1 == "LOAD" { print $NF }' \
              /tmp/libick-foundation.program-headers
          )
          test "${#aligns[@]}" -gt 0
          for align in "${aligns[@]}"; do
            test "$((align))" -ge ${{ matrix.required_load_alignment }}
          done

      - name: Record qualification boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ${{ matrix.abi }} foundation receipt

          PASS: pinned GCC reference and squashed ICK source materialized

          PASS: ICK compiler built and its own installed `cc1` was used

          PASS: Float16/E4M3/E5M2/E3M2/E5M3 and Circle96 compiled with their intended arithmetic/category boundaries

          PASS: expected ELF class/machine, PIC object, Android API 21 link,
          exported scalar boundary, mismatched-target refusal, and the ABI's
          required load alignment

          SKIP: Android runtime execution, complete Wegert library, APK, and
          F-Droid packaging remain outside this foundation job
          EOF
