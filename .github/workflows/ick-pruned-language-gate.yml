name: ICK pruned language gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out ICK source and pinned GCC reference
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Materialize the owned C-only source
        shell: bash
        run: |
          set -euxo pipefail
          sh ick/materialize.sh gcc source

          while IFS= read -r path; do
            case "$path" in
              ""|\#*) continue ;;
            esac
            test ! -e "source/$path"
          done < ick/PRUNE

          test -d source/gcc/c
          test -d source/gcc/c-family
          test -d source/gcc/testsuite/gcc.dg
          test -d source/gcc/testsuite/c-c++-common
          test -d source/libcody
          test -d source/libcpp

          grep -Fqx \
            'DEFTREECODE (OVERLOAD, "overload", tcc_exceptional, 0)' \
            source/gcc/c-family/c-common.def
          grep -Fqx \
            'DEFTREECODE (TEMPLATE_DECL, "template_decl", tcc_declaration, 0)' \
            source/gcc/c-family/c-common.def
          grep -Fqx \
            'DEFTREECODE (USING_DECL, "using_decl", tcc_declaration, 0)' \
            source/gcc/c-family/c-common.def
          grep -Fqx \
            'DEFTREECODE (ALIGNOF_EXPR, "alignof_expr", tcc_expression, 1)' \
            source/gcc/c-family/c-common.def
          grep -Fqx \
            'DEFTREECODE (EXPR_STMT, "expr_stmt", tcc_expression, 1)' \
            source/gcc/c-family/c-common.def

      - name: Install C-only cross compiler build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex strace texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev \
            binutils-aarch64-linux-gnu

      - name: Check bootstrap guard positive and negative controls
        shell: bash
        run: sh qualification/bootstrap-tools/test-bison-guard.sh

      - name: Isolate Bison/Yacc and declare the retained GCC Flex generator
        shell: bash
        run: |
          set -euxo pipefail
          sh qualification/bootstrap-tools/bison-guard.sh setup source

      - name: Configure pruned C-only ICK
        shell: bash
        run: |
          set -euxo pipefail
          mkdir build stage
          cd build
          ICK_BOOTSTRAP_PHASE=configure strace -f -qq -e trace=execve -s 512 \
            -o "$GITHUB_WORKSPACE/.ick-bootstrap-guard/configure.execve" \
            ../source/configure \
            --target=aarch64-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/stage" \
            --with-as="$(command -v aarch64-linux-gnu-as)" \
            --with-ld="$(command -v aarch64-linux-gnu-ld)" \
            --enable-languages=c \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-threads \
            --without-headers \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv

      - name: Build and smoke-test C-only ICK
        shell: bash
        run: |
          set -euxo pipefail
          ICK_BOOTSTRAP_PHASE=build strace -f -qq -e trace=execve -s 512 \
            -o "$GITHUB_WORKSPACE/.ick-bootstrap-guard/build.execve" \
            make -C build -j2 all-gcc
          ICK_BOOTSTRAP_PHASE=install strace -f -qq -e trace=execve -s 512 \
            -o "$GITHUB_WORKSPACE/.ick-bootstrap-guard/install.execve" \
            make -C build install-gcc
          ick="$GITHUB_WORKSPACE/stage/bin/aarch64-linux-gnu-gcc"
          "$ick" --version
          cat > /tmp/prune-smoke.c <<'EOF'
          int add(int a, int b) { return a + b; }
          EOF
          "$ick" -O2 -fPIC -c /tmp/prune-smoke.c -o /tmp/prune-smoke.o
          aarch64-linux-gnu-readelf -h /tmp/prune-smoke.o \
            | grep -q 'Machine:.*AArch64'

      - name: Verify C-only Bison isolation and actual Flex invocation
        shell: bash
        run: |
          set -euxo pipefail
          sh qualification/bootstrap-tools/bison-guard.sh \
            verify build/gcc/gengtype-lex.cc traced
          git rev-parse HEAD
          flex --version

      - name: Retain bootstrap process evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ick-c-only-bootstrap-trace-${{ github.run_id }}
          path: .ick-bootstrap-guard/
          if-no-files-found: warn
          retention-days: 14

      - name: Record focused qualification boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: owned pruned source materialized and built with `--enable-languages=c`

          PASS: installed ICK driver produced an AArch64 PIC object

          PASS: no observed Bison/Yacc generation and traced Flex gengtype generation

          SKIP: Android runtime execution, complete Wegert library, APK, and
          F-Droid packaging remain outside this focused pruning gate
          EOF
