name: GDC baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdc-baseline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-gdc:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: true

      - name: Materialize pinned ICK and GDC source
        shell: bash
        run: |
          set -euxo pipefail
          sh ick/materialize.sh gcc source

      - name: Install GDC build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gdc flex bison texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libisl-dev libzstd-dev

      - name: Build native ICK with D enabled
        shell: bash
        run: |
          set -euxo pipefail
          mkdir build stage
          cd build
          ../source/configure \
            --prefix="$GITHUB_WORKSPACE/stage" \
            --enable-languages=c,d \
            --disable-bootstrap \
            --disable-multilib \
            --disable-nls \
            --disable-shared \
            --disable-libatomic \
            --disable-libgomp \
            --disable-libquadmath \
            --disable-libssp \
            --disable-libvtv
          make -j"$(nproc)" all-gcc
          make install-gcc

      - name: Compile plain D with the imported frontend
        shell: bash
        run: |
          set -euxo pipefail
          gdc=$(find "$GITHUB_WORKSPACE/stage/bin" -maxdepth 1 -type f \
            \( -name gdc -o -name '*-gdc' \) | head -n 1)
          test -n "$gdc"
          "$gdc" --version
          cat > /tmp/ick_gdc_baseline.d <<'EOF'
          extern(C) int ick_gdc_baseline(int x)
          {
              return x + 1;
          }
          EOF
          "$gdc" -fno-druntime -nostdinc -c /tmp/ick_gdc_baseline.d -o /tmp/ick_gdc_baseline.o
          test -s /tmp/ick_gdc_baseline.o

      - name: Record baseline boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: the pinned GCC source materialized with the complete imported GDC frontend and target hooks.

          PASS: native ICK/GCC built with `--enable-languages=c,d` and installed a GDC driver.

          PASS: that GDC compiled ordinary D source to an object without druntime.

          This gate is intentionally before Icky D Unicode syntax. It validates the compiler frontend only; libphobos/druntime remains a separate runtime import.
          EOF
