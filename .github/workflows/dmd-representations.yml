name: DMD value representations

on:
  pull_request:
    paths:
      - 'dmd/compiler/**'
      - 'dmd/library/**'
      - 'dmd/qualification/representations/**'
      - 'ick/include/ick/**'
      - '.github/workflows/dmd-representations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmd-representations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  representations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install host compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ldc binutils

      - name: Build the independent C oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .representation-build
          cc -std=c11 -O0 -ffp-contract=off -fno-fast-math -Iick/include \
            -c dmd/qualification/representations/oracle.c -o .representation-build/oracle.o
          cc -std=c11 -O0 -ffp-contract=off -fno-fast-math \
            -c dmd/qualification/representations/geometry_oracle.c -o .representation-build/geometry-oracle.o

      - name: Check the D source with the host compiler
        shell: bash
        run: |
          set -euo pipefail
          ldmd2 -betterC -Idmd/library \
            dmd/library/icky/imprecise.d dmd/library/icky/circle.d \
            dmd/qualification/representations/acceptance.d \
            .representation-build/oracle.o -of=.representation-build/host-acceptance
          .representation-build/host-acceptance
          ldmd2 -betterC -Idmd/library \
            dmd/library/icky/imprecise.d dmd/library/icky/geometry.d dmd/library/icky/projective.d \
            dmd/qualification/representations/geometry_acceptance.d \
            .representation-build/geometry-oracle.o -L-lm -of=.representation-build/host-geometry
          .representation-build/host-geometry

      - name: Build Icky DMD from the PR source
        shell: bash
        run: |
          set -euo pipefail
          cd dmd/compiler/src
          ldmd2 -run ./build.d dmd HOST_DMD="$(command -v ldmd2)"
          dmd_bin=$(find ../../generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          dmd_bin=$(realpath "$dmd_bin")
          "$dmd_bin" --version
          printf 'DMD_BIN=%s\n' "$dmd_bin" >> "$GITHUB_ENV"
          runtime_import=$(dpkg -L libphobos2-ldc-shared-dev | awk 'substr($0, length($0)-8) == "/object.d" { print substr($0, 1, length($0)-9); exit }')
          test -f "$runtime_import/object.d"
          printf 'RUNTIME_IMPORT=%s\n' "$runtime_import" >> "$GITHUB_ENV"

      - name: Execute rebuilt DMD output with and without optimization
        shell: bash
        run: |
          set -euo pipefail
          for mode in debug optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O -inline); fi
            geometry_object=".representation-build/geometry-$mode.o"
            "$DMD_BIN" -betterC -c -I"$RUNTIME_IMPORT" -Idmd/library "${flags[@]}" \
              dmd/library/icky/imprecise.d dmd/library/icky/geometry.d dmd/library/icky/projective.d \
              dmd/qualification/representations/geometry_acceptance.d \
              -of="$geometry_object"
            if nm -u "$geometry_object" | awk '{ print $NF }' | grep -Eq '^_memset'; then
              nm -u "$geometry_object"
              exit 1
            fi
            "$DMD_BIN" -betterC -I"$RUNTIME_IMPORT" -Idmd/library "${flags[@]}" \
              dmd/library/icky/imprecise.d dmd/library/icky/circle.d \
              dmd/qualification/representations/acceptance.d \
              .representation-build/oracle.o -of=".representation-build/dmd-$mode"
            ".representation-build/dmd-$mode"
            "$DMD_BIN" -betterC -I"$RUNTIME_IMPORT" -Idmd/library "${flags[@]}" \
              dmd/library/icky/imprecise.d dmd/library/icky/geometry.d dmd/library/icky/projective.d \
              dmd/qualification/representations/geometry_acceptance.d \
              .representation-build/geometry-oracle.o -L-lm -of=".representation-build/geometry-$mode"
            ".representation-build/geometry-$mode"
          done

      - name: Record exact qualification scope
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: rebuilt Icky DMD compiles and executes scalar and geometric D values.
          PASS: unoptimized and optimized output; assertions remain enabled.
          PASS: scalar C oracle, all five circle grids and forbidden-operation type checks.
          PASS: Hamilton algebra, normalization, typed rotation composition, independent C matrix action.
          PASS: geometry objects contain no unresolved druntime array-initialization helper.
          PASS: 131072 quaternion samples per compact format; packing, reconstruction and error bounds.
          PASS: projective rescaling/phase, CP0/CP1/CP2/CP4, charts and invalid-input rejection.

          Host execution only. This does not prove new primitive compiler types,
          representation-aware backend IR, the existing octahedral S2 codec,
          specialized CP2 packing, general SO(n), or Android execution.
          EOF
