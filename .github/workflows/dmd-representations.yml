name: DMD compact representations

on:
  pull_request:
    paths:
      - 'dmd/compiler/**'
      - 'dmd/library/**'
      - 'dmd/qualification/representations/**'
      - 'dmd/qualification/packed-memory/**'
      - 'ick/include/ick/**'
      - '.github/workflows/dmd-representations.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dmd-representations-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  representations:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install host compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ldc binutils

      - name: Build the independent C oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .representation-build
          cc -std=c11 -O0 -ffp-contract=off -fno-fast-math -Iick/include \
            -c dmd/qualification/representations/oracle.c -o .representation-build/oracle.o

      - name: Check the D source with the host compiler
        shell: bash
        run: |
          set -euo pipefail
          ldmd2 -betterC -Idmd/library \
            dmd/library/icky/imprecise.d dmd/library/icky/circle.d \
            dmd/library/icky/packed.d dmd/library/icky/packed_memory.d \
            dmd/qualification/representations/acceptance.d \
            .representation-build/oracle.o -of=.representation-build/host-acceptance
          .representation-build/host-acceptance

      - name: Build Icky DMD from the PR source
        shell: bash
        run: |
          set -euo pipefail
          cd dmd/compiler/src
          ldmd2 -run ./build.d dmd HOST_DMD="$(command -v ldmd2)" DFLAGS="-version=PackedMemoryTrace"
          dmd_bin=$(find ../../generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          dmd_bin=$(realpath "$dmd_bin")
          "$dmd_bin" --version
          printf 'DMD_BIN=%s\n' "$dmd_bin" >> "$GITHUB_ENV"
          runtime_import=$(dpkg -L libphobos2-ldc-shared-dev | awk 'substr($0, length($0)-8) == "/object.d" { print substr($0, 1, length($0)-9); exit }')
          test -f "$runtime_import/object.d"
          printf 'RUNTIME_IMPORT=%s\n' "$runtime_import" >> "$GITHUB_ENV"

      - name: Execute rebuilt DMD output with and without optimization
        shell: bash
        run: |
          set -euo pipefail
          for mode in debug optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O -inline); fi
            "$DMD_BIN" -betterC -I"$RUNTIME_IMPORT" -Idmd/library "${flags[@]}" \
              dmd/library/icky/imprecise.d dmd/library/icky/circle.d \
              dmd/library/icky/packed.d dmd/library/icky/packed_memory.d \
              dmd/qualification/representations/acceptance.d \
              .representation-build/oracle.o -of=".representation-build/dmd-$mode"
            ".representation-build/dmd-$mode"
          done

      - name: Reject invalid packed-memory source shapes
        shell: bash
        run: |
          set -euo pipefail
          for mode in debug optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O -inline); fi
            "$DMD_BIN" -betterC -I"$RUNTIME_IMPORT" -Idmd/library "${flags[@]}" \
              dmd/library/icky/imprecise.d dmd/library/icky/packed_memory.d \
              dmd/qualification/packed-memory/negative.d \
              -of=".representation-build/negative-$mode"
            ".representation-build/negative-$mode"
          done
          echo 'PASS: unsupported formats, operations, raw bytes, const stores, whole-slice casts, and nominal mismatches were rejected.'

      - name: Qualify packed bounds with checks disabled
        shell: bash
        run: |
          set -euo pipefail
          for mode in debug optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O -inline); fi
            "$DMD_BIN" -betterC -release -boundscheck=off -I"$RUNTIME_IMPORT" -Idmd/library \
              "${flags[@]}" dmd/library/icky/imprecise.d dmd/library/icky/packed_memory.d \
              dmd/qualification/packed-memory/bounds.d \
              .representation-build/oracle.o -of=".representation-build/packed-bounds-disabled-$mode"
            ".representation-build/packed-bounds-disabled-$mode"
            echo "PASS: store bounds qualified with checks disabled ($mode)."
          done

      - name: Qualify compute bounds with checks disabled
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          for mode in debug optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O -inline); fi
            "$DMD_BIN" -betterC -release -boundscheck=off -I"$RUNTIME_IMPORT" -Idmd/library \
              "${flags[@]}" dmd/library/icky/imprecise.d dmd/library/icky/packed.d \
              dmd/library/icky/packed_memory.d \
              dmd/qualification/packed-memory/bounds-compute.d \
              -of=".representation-build/packed-compute-bounds-disabled-$mode"
            for side in e r b l R L H; do
              set +e
              timeout 1s ".representation-build/packed-compute-bounds-disabled-$mode" "$side"
              status=$?
              set -e
              if [ "$status" -ne 134 ]; then
                echo "FAIL: invalid compute index returned status $status for $side ($mode)"
                exit 1
              fi
              echo "PASS: invalid compute index explicitly failed before returning ($side, $mode; abort status 134)."
            done
          done

      - name: Preserve packed-memory assembly receipt
        shell: bash
        run: |
          set -euo pipefail
          cat dmd/qualification/packed-memory/receipt.d \
            > .representation-build/packed-memory-lowering.txt
          printf '\nsource-commit=%s\ncompiler=%s\ncompiler-version:\n' "$(git rev-parse HEAD)" \
            >> .representation-build/packed-memory-lowering.txt
          "$DMD_BIN" --version >> .representation-build/packed-memory-lowering.txt
          for mode in debug optimized; do
            flags=()
            if [ "$mode" = optimized ]; then flags=(-O -inline); fi
            printf '\n=== %s path: flags=%s ===\n' "$mode" "${flags[*]:-none}" \
              >> .representation-build/packed-memory-lowering.txt
            printf 'target=%s\ncompiler-digest=' "$(uname -m)-$(uname -s)" \
              >> .representation-build/packed-memory-lowering.txt
            sha256sum "$DMD_BIN" >> .representation-build/packed-memory-lowering.txt
            printf 'command=%q ' "$DMD_BIN" -version=PackedMemoryTrace -betterC \
              -I"$RUNTIME_IMPORT" -Idmd/library "${flags[@]}" -c -vasm \
              dmd/library/icky/imprecise.d dmd/library/icky/packed.d \
              dmd/library/icky/packed_memory.d \
              dmd/qualification/packed-memory/receipt.d \
              -of=".representation-build/packed-memory-receipt-$mode.o" \
              >> .representation-build/packed-memory-lowering.txt
            printf '\n' >> .representation-build/packed-memory-lowering.txt
            "$DMD_BIN" -version=PackedMemoryTrace -betterC -I"$RUNTIME_IMPORT" -Idmd/library \
              "${flags[@]}" -c -vasm \
              dmd/library/icky/imprecise.d dmd/library/icky/packed.d \
              dmd/library/icky/packed_memory.d \
              dmd/qualification/packed-memory/receipt.d \
              -of=".representation-build/packed-memory-receipt-$mode.o" \
              2>&1 | tee -a .representation-build/packed-memory-lowering.txt \
              | tee ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "PACKED-IR seam=follower kind=scalar-compute" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "PACKED-IR seam=request kind=scalar-compute stages=load_packed->decode->arithmetic" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "PACKED-IR seam=follower kind=scalar-load" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "PACKED-IR seam=follower kind=checked-scalar-store" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "PACKED-IR seam=request kind=checked-scalar-store stages=encode->store_packed" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "operation=* rounding=Float16-per-operation" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "destination-storage=E5M3 domain=partial-reject-preserve-destination" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "follower=ordinary-scalar-body follower-executed=true" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "follower-executed=true" \
              ".representation-build/packed-memory-$mode-trace.txt"
            grep -F "public-surface=true" \
              ".representation-build/packed-memory-$mode-trace.txt"
            objdump -drwC -Mintel \
              ".representation-build/packed-memory-receipt-$mode.o" \
              > ".representation-build/packed-memory-receipt-$mode.disassembly"
            sha256sum ".representation-build/packed-memory-receipt-$mode.o" \
              ".representation-build/packed-memory-receipt-$mode.disassembly" \
              >> .representation-build/packed-memory-lowering.txt
            "$DMD_BIN" -version=PackedMemoryTrace -betterC -I"$RUNTIME_IMPORT" -Idmd/library \
              "${flags[@]}" \
              dmd/library/icky/imprecise.d dmd/library/icky/packed.d \
              dmd/library/icky/packed_memory.d \
              dmd/qualification/packed-memory/receipt.d \
              -of=".representation-build/packed-memory-receipt-$mode"
            printf 'execution-command=%q\n' \
              ".representation-build/packed-memory-receipt-$mode" \
              >> .representation-build/packed-memory-lowering.txt
            ".representation-build/packed-memory-receipt-$mode"
            echo "execution=$? mode=$mode" >> .representation-build/packed-memory-lowering.txt
          done
          ls -l .representation-build/packed-memory-receipt-*.o \
            .representation-build/packed-memory-receipt-*.disassembly
          cat .representation-build/packed-memory-lowering.txt
          cat .representation-build/packed-memory-receipt-debug.disassembly
          cat .representation-build/packed-memory-receipt-optimized.disassembly
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: packed-memory receipt compiled and emitted x86-64 assembly and object disassembly.
          Inspect this job's logs for exact source lowering and generated instructions;
          no optimization claim is made.
          EOF

      - name: Upload packed-memory compiler receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: packed-memory-receipts-${{ github.run_id }}
          path: |
            .representation-build/packed-memory-lowering.txt
            .representation-build/packed-memory-*-trace.txt
            .representation-build/packed-memory-receipt-*.o
            .representation-build/packed-memory-receipt-*.disassembly
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error

      - name: Record exact qualification scope
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          PASS: rebuilt Icky DMD compiles and executes the compact D representations.
          PASS: debug and optimized output agree with the existing C oracle.
          PASS: scalar payloads, midpoint neighbours, domain rejection and requantization.
          PASS: binary16 +, -, *, / use the native payload/integer semantic implementation.
          PASS: checked E5M3 +, -, and narrow * avoid Float16/binary32 arithmetic.
          PASS: Circle96 oracle and finite geometry laws at 96/192/240/360/720 positions.
          PASS: unchecked E5M3 opBinary, implicit E5M3 add/sub widening, and mixed categories fail source type checking.

          This proves native D value-type support on the host. It does not prove
          new primitive compiler types, representation-aware backend IR, geometric
          codecs for quaternions/SO(n)/S²/CPⁿ, or Android execution.
          EOF
