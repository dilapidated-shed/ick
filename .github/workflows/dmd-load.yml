name: Load DMD source

on:
  push:
    branches:
      - dmd
    paths:
      - 'dmd/load.sh'
      - '.github/workflows/dmd-load.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out DMD line
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Stop if the owned snapshot already exists
        id: source
        shell: bash
        run: |
          if test -f dmd/SOURCE.lock; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo 'DMD source is already loaded.'
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Load exact upstream compiler snapshot
        if: steps.source.outputs.needed == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          sh dmd/load.sh

      - name: Install host compiler
        if: steps.source.outputs.needed == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ldc
          command -v ldmd2

      - name: Build before committing the snapshot
        if: steps.source.outputs.needed == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          cd dmd/compiler/src
          ldmd2 -run ./build.d dmd HOST_DMD="$(command -v ldmd2)"
          dmd_bin=$(find ../generated -type f -name dmd -perm -u+x -print -quit)
          test -n "$dmd_bin"
          "$dmd_bin" --version

          cat > /tmp/dmd-load-smoke.d <<'EOF'
          module dmd_load_smoke;
          extern(C) int add(int a, int b) { return a + b; }
          EOF
          "$dmd_bin" -betterC -c /tmp/dmd-load-smoke.d -of=/tmp/dmd-load-smoke.o
          test -s /tmp/dmd-load-smoke.o

      - name: Commit owned source to dmd
        if: steps.source.outputs.needed == 'true'
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf dmd/compiler/generated
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dmd/compiler dmd/LICENSE.txt dmd/VERSION dmd/SOURCE.lock
          git diff --cached --check
          git commit -m 'Load standalone DMD v2.113.0 baseline'
          git push origin HEAD:dmd
