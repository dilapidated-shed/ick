name: Materialize tested ARM patch
on:
  push:
    branches: [dmd-android-arm-backends]
    paths: ['.github/workflows/dmd-arm-apply.yml', '.github/dmd-arm-transfer.part*']
permissions:
  contents: write
jobs:
  apply-exact-patch:
    if: github.ref == 'refs/heads/dmd-android-arm-backends'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Check branch provenance and transfer integrity
        shell: bash
        run: |
          set -euxo pipefail
          git merge-base --is-ancestor 1446230060606dbe504eb65bb60cc48606bb1bd9 HEAD
          python3 - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          root = pathlib.Path('.')
          parts = [f'.github/dmd-arm-transfer.part{i}' for i in range(4)]
          permitted = set(parts + ['.github/workflows/dmd-arm-apply.yml'])
          changed = set(subprocess.check_output(['git','diff','--name-only','1446230060606dbe504eb65bb60cc48606bb1bd9','HEAD'], text=True).splitlines())
          assert changed == permitted, ('unexpected branch changes', changed)
          encoded = ''.join(''.join((root/p).read_text().split()) for p in parts)
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'a435b25030c474ded3dc516da08f7977879d5dcc0410e9abeda121956db11617'
          pathlib.Path('/tmp/owned-arm.patch').write_bytes(patch)
          PY
          git apply --check /tmp/owned-arm.patch
          git apply --index /tmp/owned-arm.patch
          git diff --cached --check
      - name: Commit source without granting this job workflow-edit authority
        shell: bash
        run: |
          set -euxo pipefail
          # The authenticated connector will install the two small workflow
          # updates and remove this one-shot transport after the source commit.
          git restore --source=HEAD --staged --worktree .github/workflows/dmd-android-arm.yml .github/workflows/dmd-baseline.yml
          git rm .github/dmd-arm-transfer.part0 .github/dmd-arm-transfer.part1 .github/dmd-arm-transfer.part2 .github/dmd-arm-transfer.part3
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add native Thumb-2 leaves and Android AArch64 qualification; fix floating comparisons'
          # Ordinary fast-forward only: concurrent branch changes fail closed.
          git push origin HEAD:refs/heads/dmd-android-arm-backends
