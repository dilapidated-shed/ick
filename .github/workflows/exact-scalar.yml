name: Exact arithmetic components
on:
  pull_request:
    paths:
      - arithmetic/openai2026/**
      - examples/autogenerated/mul-1/**
      - examples/autogenerated/mul-4/**
      - .github/workflows/exact-scalar.yml
permissions:
  contents: read
env:
  IDRIS2_PREFIX: ${{ github.workspace }}/Idric/_/bootstrap-build
  CHEZ: ${{ github.workspace }}/Idric/_/.tools/bin/scheme
jobs:
  exact-scalar:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact arithmetic candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out the retained ICK runtime source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: dilapidated-shed/ick
          ref: 143e29580c2644ea0f345fe609fa5673d036865d
          path: runtime-source
          submodules: true
          persist-credentials: false
      - name: Check out the pinned independent oracle compiler
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/Idric
          ref: 2734ac5a86610eddfab73b1644d72b4ac85a65ee
          path: Idric
          persist-credentials: false
      - name: Check out the immutable STAR corpus
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: walnut-burgundy/computer-science
          ref: 32aa3dc5e0e9c2dd19eacb05e515894e252d0886
          path: STAR
          persist-credentials: false
      - name: Install host bootstrap dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential flex bison texinfo curl libgmp-dev libmpfr-dev libmpc-dev
      - name: Build and qualify the retained ICK compiler
        working-directory: runtime-source
        run: make -f qualification/native-polar/Makefile build check
      - name: Bootstrap the exact independent Idriç compiler through Chez
        env:
          CC: ${{ github.workspace }}/runtime-source/build/native-polar/stage/bin/gcc
          CFLAGS: -fno-link-libatomic -static-libgcc
        run: ./Idric/edric bootstrap
      - name: Execute the candidate and every required defect through the outer runner
        env:
          PATH: ${{ github.workspace }}/Idric/_/.tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: make -C arithmetic/openai2026 check mutants ICK_CC="$GITHUB_WORKSPACE/runtime-source/build/native-polar/stage/bin/gcc" ORACLE_IDRIC="$GITHUB_WORKSPACE/Idric/_/build/exec/idris2" CORPUS="$GITHUB_WORKSPACE/STAR/integer-multiplication/openai-2026/contracts/mul-v1.tsv"
      - name: Execute certified scalar, ordered line and padded tensor resampling gates
        env:
          PATH: ${{ github.workspace }}/Idric/_/.tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: make -C arithmetic/openai2026 check-resampling mutants-resampling ICK_CC="$GITHUB_WORKSPACE/runtime-source/build/native-polar/stage/bin/gcc" ORACLE_IDRIC="$GITHUB_WORKSPACE/Idric/_/build/exec/idris2" CORPUS="$GITHUB_WORKSPACE/STAR/integer-multiplication/openai-2026/contracts/mul-v1.tsv"
      - name: Preserve exact values, intervals, dependencies, identities and statuses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-scalar-evidence
          path: |
            arithmetic/openai2026/build/
            runtime-source/build/native-polar/scalar-runtime-packages.tsv
            runtime-source/build/native-polar/ick-runtime.sha256
