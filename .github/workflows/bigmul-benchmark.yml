name: Bigmul native correctness and benchmark smoke

on:
  pull_request:
    paths:
      - 'benchmarks/bigmul/**'
      - 'examples/autogenerated/mb07-16-controls/**'
      - '.github/workflows/bigmul-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: x86_64
          - runner: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.runner }}
    env:
      ITHON: ${{ github.workspace }}/.benchmark-tools/ithon/ithon
      ITHON_PYTHON: /usr/bin/python3
    steps:
      - name: Check out exact initiating commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned Ithon frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dilapidated-shed/ithon
          ref: 74ab6d6044b07b76a910978437a34a6b5ac6acda
          path: .benchmark-tools/ithon
          persist-credentials: false
      - name: Prepare raw receipt directory
        run: mkdir -p benchmarks/bigmul/release/last-run
      - name: Qualify the checked Ithon frontend
        run: .benchmark-tools/ithon/ithon .benchmark-tools/ithon/tests/qualify-host-control.pi benchmarks/bigmul/release/last-run/ithon-qualification.json
      - name: Record runner and toolchain
        run: |
          uname -a
          cc --version | head -n 1
          python3 --version
          git rev-parse HEAD
      - name: Refresh host package metadata
        run: sudo apt-get update
      - name: Install independent host oracle and GMP comparison headers
        run: sudo apt-get install --no-install-recommends -y bc libgmp-dev
      - name: Exactness and harness smoke tests
        run: python3 benchmarks/bigmul/test_mulbench.py
      - name: MB-02 bounded C ABI and protocol adversarial tests
        run: python3 benchmarks/bigmul/abi/check_mb02.py
      - name: MB-02 host sanitizer, overflow and allocation failure controls
        run: python3 benchmarks/bigmul/abi/check_mb02_extended.py
      - name: Execute available MB campaign controls with honest readiness boundaries
        env:
          ITHON_CHECK_RECEIPT: ${{ github.workspace }}/benchmarks/bigmul/release/last-run/ithon-checked.jsonl
        run: python3 benchmarks/bigmul/release/check_mb21.py --run-controls --expected-arch ${{ matrix.architecture }} --output benchmarks/bigmul/release/last-run/campaign.json
      - name: Calibrated schoolbook smoke timing (not a regression gate)
        working-directory: benchmarks/bigmul
        run: |
          cc -O3 -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra mulbench.c -o mulbench
          ./mulbench --bench 4096 5 > baseline.csv
          {
            echo "source_sha=$(git rev-parse HEAD)"
            echo "compiler_flags=-O3 -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra"
            uname -a
            cc --version | head -n 1
            python3 --version
            lscpu || true
          } > machine.txt
          head -n 16 baseline.csv
          {
            echo "### Bigmul smoke — ${{ matrix.runner }}"
            echo "Commit: $(git rev-parse HEAD)"
            echo ""
            sed 's/^/    /' baseline.csv | head -n 16
            echo ""
            echo "Hot in-process schoolbook baseline only; no performance gate or cross-runner ranking."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain machine-specific timing receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bigmul-smoke-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runner }}
          path: |
            benchmarks/bigmul/baseline.csv
            benchmarks/bigmul/machine.txt
            benchmarks/bigmul/release/last-run/
          if-no-files-found: error
          retention-days: 30
